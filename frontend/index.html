<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Studio</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="studio"><header class="head"><div><h1>Live <span class="pill">STUDIO</span></h1><p>استوديو الشخصية العربية</p></div><span class="live"><i></i> LIVE</span></header>
<nav class="app-tabs"><button class="app-tab active" data-panel="videoPanel">🎬 Video Making</button><button class="app-tab" data-panel="livePanel">🔴 Live</button></nav>
<section id="videoPanel" class="app-panel"><section class="workspace"><div class="preview"><div class="previewhead">معاينة Live أثناء السرد</div><div class="character" id="character"><svg viewBox="0 0 220 300" aria-label="Line art streamer"><circle cx="110" cy="75" r="48"/><path d="M62 75 Q110 20 158 75 M62 55 Q45 75 60 100 M158 55 Q175 75 160 100"/><path d="M80 72 L102 72 M118 72 L140 72"/><path id="mouth" d="M95 103 Q110 115 125 103"/><path d="M110 123 L110 224 M65 155 L110 135 L155 155 M80 225 L110 224 L140 225 M110 224 L85 275 M110 224 L135 275 M65 155 Q50 190 62 208 M155 155 Q170 190 158 208 M49 60 Q40 90 55 112 M171 60 Q180 90 165 112"/></svg><div class="bubble" id="bubble">اختر قصة وسأرويها!</div></div><div class="status" id="status">جاهز</div></div>
<div class="editor"><h2>Video Making</h2><div class="types"><button class="type active" data-type="story">قصّة</button><button class="type" data-type="commentary">تعليق</button><button class="type" data-type="reaction">ردّة فعل</button></div><label>الموضوع أو رابط القصة</label><textarea id="topic" rows="3" placeholder="مثلاً: قصة أغرب عملية سرقة فاشلة…"></textarea><label>نبرة الشخصية</label><select id="tone"><option>ساخر وخفيف</option><option>حماسي</option><option>هادئ وقصصي</option><option>هجومي كوميدي</option></select><button id="draft" class="primary">✍️ اكتب السيناريو</button><div id="scriptbox" class="scriptbox" hidden><label>السيناريو (عدّل بحرية)</label><textarea id="script" rows="10"></textarea><div class="script-actions"><button id="copy">نسخ</button><button id="perform" class="primary">▶️ عرض السرد والحركات</button><button id="stop" class="stop">⏹ إيقاف</button></div></div><div id="narration" class="narration" hidden><label>المقطع الحالي</label><div id="segment"></div><div id="progress"></div></div><div class="divider"></div><p class="hint">العرض يحاكي توقيت السرد وحركات الشخصية بصرياً. الصوت وتصدير MP4 لم يُفعّلا بعد.</p></div></section></section>
<section id="livePanel" class="app-panel" hidden><div class="panel"><h2>Live — تجربة ردود التعليقات</h2><p class="hint">هذا القسم تجريبي حتى يتم ربط بث مباشر فعلي.</p><div id="modes" class="modes"></div><div class="chat"><input id="chat" placeholder="اكتب تعليقاً لاختبار الرد…"><button id="send">إرسال</button></div><div id="feed" class="feed"><div class="feedtitle">التعليقات وردود Live</div></div></div></section></main><script src="/app.js"></script></body></html>
