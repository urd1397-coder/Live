name: Expand uploaded project
on:
  push:
    paths:
      - "Live-main-updated (1).zip"
      - ".github/workflows/expand-project.yml"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project files
        run: |
          unzip -q "Live-main-updated (1).zip" -d /tmp/live-src
          test -d /tmp/live-src/Live-main
          cp -a /tmp/live-src/Live-main/. .
          rm -f "Live-main-updated (1).zip"
          rm -rf backend/__pycache__
      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand project source files"
            git push
          fi
